[package]
name = "noir-desktop"
version = "2.0.0"
description = "Noir Desktop — Standalone AI Agent Workbench"
authors = ["rheatkhs"]
license = "MIT"
repository = "https://github.com/rheatkhs/noir-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "noir_desktop_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["process", "io-util", "sync"] }
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
futures-util = "0.3"
